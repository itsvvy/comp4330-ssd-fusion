<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">VOC2007 SSD300 and selective tiled inference results</title>
  <desc id="desc">Selective tiled inference improves overall mAP from 77.66 to 78.33 and small object AP from 10.78 to 30.65, while reducing FPS from 19.06 to 5.45.</desc>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="48" y="52" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#172033">VOC2007 test: accuracy-first tiled inference</text>
  <text x="48" y="82" font-family="Arial, sans-serif" font-size="15" fill="#536176">Released SSD300 weights · 4,952 images · no retraining</text>

  <rect x="48" y="112" width="590" height="348" rx="12" fill="#f7f9fc" stroke="#dfe5ee"/>
  <text x="76" y="148" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#172033">Detection accuracy</text>
  <text x="76" y="176" font-family="Arial, sans-serif" font-size="13" fill="#64748b">mAP at IoU 0.5 (%)</text>

  <g font-family="Arial, sans-serif">
    <text x="76" y="230" font-size="14" fill="#334155">Overall mAP</text>
    <rect x="76" y="244" width="359" height="26" rx="4" fill="#cbd5e1"/>
    <rect x="76" y="276" width="363" height="26" rx="4" fill="#2563eb"/>
    <text x="445" y="263" font-size="14" fill="#334155">77.66%</text>
    <text x="449" y="295" font-size="14" font-weight="700" fill="#1d4ed8">78.33%</text>

    <text x="76" y="344" font-size="14" fill="#334155">Small-object AP</text>
    <rect x="76" y="358" width="108" height="26" rx="4" fill="#cbd5e1"/>
    <rect x="76" y="390" width="307" height="26" rx="4" fill="#0f9f74"/>
    <text x="194" y="377" font-size="14" fill="#334155">10.78%</text>
    <text x="393" y="409" font-size="14" font-weight="700" fill="#087f5b">30.65%</text>
  </g>

  <rect x="664" y="112" width="248" height="348" rx="12" fill="#fff8ed" stroke="#f2dfc2"/>
  <text x="692" y="148" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#172033">Throughput cost</text>
  <text x="692" y="176" font-family="Arial, sans-serif" font-size="13" fill="#64748b">Frames per second</text>
  <rect x="704" y="220" width="50" height="166" rx="5" fill="#64748b"/>
  <rect x="792" y="292" width="50" height="94" rx="5" fill="#e07a1f"/>
  <text x="694" y="410" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#334155">19.06</text>
  <text x="786" y="410" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#a64b00">5.45</text>
  <text x="679" y="438" font-family="Arial, sans-serif" font-size="12" fill="#536176">single pass</text>
  <text x="779" y="438" font-family="Arial, sans-serif" font-size="12" fill="#536176">full + 4 tiles</text>

  <rect x="48" y="482" width="14" height="14" fill="#2563eb"/>
  <text x="70" y="494" font-family="Arial, sans-serif" font-size="13" fill="#536176">Selective tiled</text>
  <rect x="178" y="482" width="14" height="14" fill="#cbd5e1"/>
  <text x="200" y="494" font-family="Arial, sans-serif" font-size="13" fill="#536176">Released SSD300</text>
  <text x="866" y="494" font-family="Arial, sans-serif" font-size="12" fill="#7c889a">COMP4330</text>
</svg>
